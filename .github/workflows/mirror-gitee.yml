name: Mirror to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-gitee
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::未配置 GITEE_TOKEN。请在仓库 Settings → Secrets and variables → Actions 中添加 Gitee 私人令牌后重新运行。"
            exit 1
          fi
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/jingjingpeng/Tutorials.git"
          git push --force gitee "HEAD:refs/heads/master"
          git push --force gitee --tags
